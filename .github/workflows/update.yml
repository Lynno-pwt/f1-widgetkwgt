name: Update F1 JSON

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Convert API
        run: |
          python << 'EOF'
          import json
          import urllib.request

          url = "https://api.jolpi.ca/ergast/f1/current/next.json"

          data = json.loads(
              urllib.request.urlopen(url).read().decode()
          )

          race = data["MRData"]["RaceTable"]["Races"][0]

          output = {
              "gp": race["raceName"],
              "track": race["Circuit"]["circuitName"],
              "country": race["Circuit"]["Location"]["country"],
              "city": race["Circuit"]["Location"]["locality"],
              "date": race["date"],
              "time": race["time"][:5]
          }

          with open("f1.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add f1.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update F1 data"
          fi

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
